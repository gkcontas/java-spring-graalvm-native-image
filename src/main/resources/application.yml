spring:
  application:
    name: native-image-catalog
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog
    username: catalog
    password: catalog
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate


app:
  # Class.forName on this value: every strategy that may be named here needs a
  # reflection hint (PricingHints), or the native binary fails at startup.
  pricing:
    rounding: com.gkcontas.nativeimage.pricing.HalfEvenRounding
